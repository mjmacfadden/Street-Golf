<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Golf - Sign In</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background: #010409;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #BFFF00;
      font-size: 24px;
    }
    p {
      margin-bottom: 15px;
      color: #ccc;
    }
    button {
      background-color: #BFFF00;
      color: #010409;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      color: #ff6b6b;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Street Golf</h1>
    <p id="status">Loading...</p>
    <button id="signInBtn" onclick="handleSignIn()" style="display: none;">Sign In with Google</button>
    <div id="error" class="error"></div>
  </div>

  <script type="module">
    // Firebase config — minimal config for OAuth flow
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, browserPopupRedirectResolver } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDxlOuLyPw8yWx6SqWVUiKYz-_0lOdOGzU",
      authDomain: "street-golf-69679.firebaseapp.com",
      projectId: "street-golf-69679",
      storageBucket: "street-golf-69679.appspot.com",
      messagingSenderId: "970338305869",
      appId: "1:970338305869:web:ec2d71f0edbf98a4b47c16",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Get URL parameters
    const getUrlParams = () => {
      const params = new URLSearchParams(window.location.search);
      return {
        mode: params.get('mode') || 'popup',
        origin: params.get('origin') || 'https://mjmacfadden.github.io',
        return: params.get('return') || null,
      };
    };

    // Handle popup mode: receive idToken and send via postMessage
    const handlePopupMode = async () => {
      const params = getUrlParams();
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const btnEl = document.getElementById('signInBtn');

      window.handleSignIn = async () => {
        try {
          statusEl.textContent = 'Signing in...';
          errorEl.textContent = '';
          btnEl.disabled = true;

          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });

          const result = await signInWithPopup(auth, provider, browserPopupRedirectResolver);
          let token = null;

          if (result.user) {
            token = await result.user.getIdToken(true);
          }

          statusEl.textContent = 'Completing sign-in...';

          if (window.opener && token) {
            window.opener.postMessage(
              { type: 'AUTH_SUCCESS', idToken: token },
              params.origin
            );
            setTimeout(() => window.close(), 500);
          } else if (!window.opener) {
            throw new Error('No parent window found.');
          } else if (!token) {
            throw new Error('Failed to get authentication token.');
          }
        } catch (error) {
          console.error('Auth error:', error);
          const errorMsg = error instanceof Error ? error.message : 'Sign-in failed.';
          errorEl.textContent = errorMsg;
          statusEl.textContent = 'Error occurred';
          btnEl.disabled = false;

          if (window.opener) {
            window.opener.postMessage(
              { type: 'AUTH_ERROR', error: errorMsg },
              params.origin
            );
          }
        }
      };

      window.addEventListener('DOMContentLoaded', () => {
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('signInBtn');
        statusEl.textContent = 'Click the button to sign in with Google';
        btnEl.style.display = 'inline-block';
      });
    };

    // Handle redirect mode: do OAuth redirect flow, store result, redirect back
    const handleRedirectMode = async () => {
      const params = getUrlParams();
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');

      try {
        // Check if we're returning from a redirect
        const result = await getRedirectResult(auth);

        if (result && result.user) {
          // Successfully authenticated - get token and store it
          const token = await result.user.getIdToken(true);
          statusEl.textContent = 'Signing in...';

          // Store the token in sessionStorage so the return page can access it
          sessionStorage.setItem('street_golf_auth_token', token);
          sessionStorage.setItem('street_golf_auth_user', JSON.stringify({
            uid: result.user.uid,
            email: result.user.email,
            displayName: result.user.displayName,
            photoURL: result.user.photoURL,
          }));

          // Redirect back to the app
          if (params.return) {
            window.location.href = params.return + (params.return.includes('?') ? '&auth=success' : '?auth=success');
          } else {
            statusEl.textContent = 'Sign-in successful. Redirecting...';
          }
        } else {
          // First load - initiate the redirect
          statusEl.textContent = 'Redirecting to Google...';
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await signInWithRedirect(auth, provider);
        }
      } catch (error) {
        console.error('Auth error:', error);
        const errorMsg = error instanceof Error ? error.message : 'Sign-in failed.';
        errorEl.textContent = errorMsg;
        statusEl.textContent = 'Error occurred';

        // If there's a return URL, redirect with error
        if (params.return) {
          setTimeout(() => {
            window.location.href = params.return + (params.return.includes('?') ? '&auth=error' : '?auth=error');
          }, 2000);
        }
      }
    };

    // Initialize based on mode
    window.addEventListener('DOMContentLoaded', () => {
      const mode = new URLSearchParams(window.location.search).get('mode') || 'popup';
      if (mode === 'redirect') {
        handleRedirectMode();
      } else {
        handlePopupMode();
      }
    });
  </script>
</body>
</html>
