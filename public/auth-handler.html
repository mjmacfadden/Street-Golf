<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Golf - Sign In</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background: #010409;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #BFFF00;
      font-size: 24px;
    }
    p {
      margin-bottom: 15px;
      color: #ccc;
    }
    button {
      background-color: #BFFF00;
      color: #010409;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      color: #ff6b6b;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Street Golf</h1>
    <p id="status">Signing in...</p>
    <div id="error" class="error"></div>
  </div>

  <script type="module">
    // Firebase config — minimal config for OAuth flow
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDxlOuLyPw8yWx6SqWVUiKYz-_0lOdOGzU",
      authDomain: "street-golf-69679.firebaseapp.com",
      projectId: "street-golf-69679",
      storageBucket: "street-golf-69679.appspot.com",
      messagingSenderId: "970338305869",
      appId: "1:970338305869:web:ec2d71f0edbf98a4b47c16",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Get the target origin from the URL query parameter, with fallback to GitHub Pages for production
    const getTargetOrigin = () => {
      const params = new URLSearchParams(window.location.search);
      return params.get('origin') || 'https://mjmacfadden.github.io';
    };

    const sendMessageToOpener = (type, data) => {
      if (window.opener) {
        window.opener.postMessage(
          { type, ...data },
          getTargetOrigin()
        );
      }
    };

    const handleAuthResult = async () => {
      try {
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');

        // Check if we're returning from a redirect
        const result = await getRedirectResult(auth);
        
        if (result) {
          // Successfully authenticated after redirect
          const idToken = await result.user.getIdToken(true);
          statusEl.textContent = 'Completing sign-in...';
          sendMessageToOpener('AUTH_SUCCESS', { idToken });
          // Close after a short delay to ensure message is received
          setTimeout(() => window.close(), 500);
        } else {
          // First load - initiate the redirect
          statusEl.textContent = 'Redirecting to Google...';
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await signInWithRedirect(auth, provider);
        }
      } catch (error) {
        const errorEl = document.getElementById('error');
        const statusEl = document.getElementById('status');

        console.error('Auth error:', error);
        const errorMsg = error instanceof Error ? error.message : 'Sign-in failed. Please try again.';
        errorEl.textContent = errorMsg;
        statusEl.textContent = 'Error occurred';

        // Send error back to opener
        sendMessageToOpener('AUTH_ERROR', { error: errorMsg });
      }
    };

    // Handle redirect result or initiate sign-in
    window.addEventListener('DOMContentLoaded', handleAuthResult);
  </script>
</body>
</html>
